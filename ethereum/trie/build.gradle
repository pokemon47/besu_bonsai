apply plugin: 'java-library'

jar {
  archiveBaseName = calculateArtifactId(project)
  manifest {
    attributes(
      'Specification-Title': archiveBaseName,
      'Specification-Version': project.version,
      'Implementation-Title': archiveBaseName,
      'Implementation-Version': calculateVersion(),
      'Commit-Hash': getGitCommitDetails(40).hash
      )
  }
}

dependencies {
  implementation project(':crypto:algorithms')
  implementation project(':datatypes')
  implementation project(':ethereum:rlp')
  implementation project(':plugin-api')

  implementation 'org.immutables:value-annotations'
  implementation 'com.google.guava:guava'
  implementation 'io.opentelemetry:opentelemetry-api'
  implementation 'io.consensys.tuweni:tuweni-bytes'
  implementation 'org.bouncycastle:bcprov-jdk18on'

  annotationProcessor 'org.immutables:value'

  testImplementation project(':services:kvstore')
  testImplementation project(':testutil')

  testImplementation 'com.fasterxml.jackson.core:jackson-databind'
  testImplementation 'io.consensys.tuweni:tuweni-units'
  testImplementation 'org.assertj:assertj-core'
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
}

def poseidon2CliInstallDir = layout.buildDirectory.dir("install/besu-poseidon2-hash")

tasks.register('installPoseidon2HashCli') {
  dependsOn jar

  inputs.files(tasks.named('jar'), configurations.runtimeClasspath)
  outputs.dir(poseidon2CliInstallDir)

  doLast {
    def installDir = poseidon2CliInstallDir.get().asFile
    def libDir = new File(installDir, 'lib')
    def binDir = new File(installDir, 'bin')

    delete installDir
    libDir.mkdirs()
    binDir.mkdirs()

    copy {
      from tasks.named('jar').get().archiveFile
      from configurations.runtimeClasspath
      into libDir
    }

    def script = new File(binDir, 'besu-poseidon2-hash')
    script.text =
      """#!/usr/bin/env sh
APP_HOME=\$(CDPATH= cd -- "\$(dirname -- "\$0")/.." && pwd)
CLASSPATH="\$APP_HOME/lib/*"
exec java -cp "\$CLASSPATH" org.hyperledger.besu.ethereum.trie.hash.Poseidon2Bn254ByteHashCli "\$@"
"""
    script.setExecutable(true)
  }
}
